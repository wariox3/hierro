# Sitio Nginx del servicio de noticias.
# Instalar en /etc/nginx/sites-available/news-service y enlazar en sites-enabled.
# Reemplaza noticias.ejemplo.com por tu dominio. Los certificados los emite Certbot
# (ver deploy/APROVISIONAMIENTO.md).

# Límite básico por IP, delante del rate limit por API key que aplica la API.
limit_req_zone $binary_remote_addr zone=news_api:10m rate=20r/s;

# Conserva el X-Request-ID del cliente o genera uno.
map $http_x_request_id $news_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream news_service {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name noticias.ejemplo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name noticias.ejemplo.com;

    ssl_certificate     /etc/letsencrypt/live/noticias.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noticias.ejemplo.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # API de solo lectura: no hay cuerpos que recibir.
    client_max_body_size 16k;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    limit_req zone=news_api burst=40 nodelay;
    limit_req_status 429;

    # /ready es para el despliegue (que consulta 127.0.0.1:8000 directamente), no para internet.
    location = /ready {
        return 404;
    }

    location / {
        proxy_pass http://news_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $news_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
