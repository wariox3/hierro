[project]
name = "hierro"
version = "0.1.0"
description = "Servicios REST globales de Semántica Digital para las aplicaciones del ecosistema."
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",     # pycodestyle (advertencias)
    "F",     # pyflakes
    "I",     # orden de imports
    "B",     # bugbear
    "UP",    # pyupgrade
    "SIM",   # simplificaciones
    "C4",    # comprensiones
    "DTZ",   # fechas sin zona horaria
    "ASYNC", # errores comunes en código async
    "S",     # seguridad (bandit)
    "PT",    # estilo de pytest
    "RUF",   # reglas propias de ruff
]

[tool.ruff.lint.per-file-ignores]
# En los tests se usan assert y credenciales de prueba.
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "scripts", "tests"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
